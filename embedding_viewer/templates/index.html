<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Embedding Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<h1>Embedding Viewer</h1>

<!-- date / run -->
<form method="post" action="/read">
  <label>Date</label>
  <select name="date">
    {% for d in dates %}
      <option value="{{d}}" {% if d==selected_date %}selected{% endif %}>{{d}}</option>
    {% endfor %}
  </select>

  <label>Run</label>
  <select name="run">
    {% for r in runs %}
      <option value="{{r}}" {% if r==selected_run %}selected{% endif %}>{{r}}</option>
    {% endfor %}
  </select>

  <button type="submit">Read</button>
</form>

{% if train_labels %}
<hr>

<form method="post" action="/plot">
<input type="hidden" name="date" value="{{selected_date}}">
<input type="hidden" name="run" value="{{selected_run}}">

<h3>Train labels</h3>
{% for lab in train_labels %}
  <label class="checkbox-line">
    <input type="checkbox" name="train_labels" value="{{lab}}"
      {% if lab in selected_train_labels %}checked{% endif %}>
    {{lab}}
  </label><br>
{% endfor %}

<h3>Test labels</h3>
{% for lab in test_labels %}
  <label class="checkbox-line">
    <input type="checkbox" name="test_labels" value="{{lab}}"
      {% if lab in selected_test_labels %}checked{% endif %}>
    {{lab}}
  </label><br>
{% endfor %}

<hr>

<label>Model</label>
<select name="model">
  {% for m in model_names %}
    <option value="{{m}}">{{m}}</option>
  {% endfor %}
</select>

<label>Method</label>
<select name="method">
  <option value="tsne">t-SNE</option>
  <option value="umap">UMAP</option>
</select>

<label>
  <input type="checkbox" name="show_labels" checked> Show legend
</label>

<label>
  <input type="checkbox" name="use_title"> Title
</label>
<input name="title">

<button type="submit">Draw</button>
</form>
{% endif %}

{% if image_data %}
<hr>
<img src="data:image/png;base64,{{image_data}}">
<pre>{{summary}}</pre>
<b>ARI:</b> {{ari}}　
<b>NMI:</b> {{nmi}}
{% endif %}

</body>
</html>
