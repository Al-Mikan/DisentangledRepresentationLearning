# config_search.yaml
# === 実験設定 ===
project_name: animalkingdom_aug
experiment_name: triplet_vs_gan
output_root: ./train_result
train_label_paths:
  [./label/train/animalkingdom.csv]
test_label_paths: ./label/test/elephant.csv

# === モード設定 ===
train_mode: [gated] # mae / flow / gated
loss_type: [msloss] # triplet / msloss
adversarial: [dann] # dann / kl
flow_preprocessing: [normal] # normal / centered
pooling: False
frame_stride: 16  # pooling=False時のフレーム間隔（16=重複なし）

# === モデル設定 ===
fused_dim: 512
feature_dim: 256

# === ハイパーパラメータ探索範囲 ===
# Learning Rate: 発散を防ぐため少し小さめから探索
lr_enc: [1.0e-5, 5.0e-5, 1.0e-4, 3.0e-4]
  
# Action Classification Weight
lambda_cls: [0.1, 0.5, 1.0]
  
# Adversarial Weight (DANN)
# 固定値で入るので、初期は小さめが良い (0.1以上は不安定になりがち)
lambda_adv: [0.01, 0.05, 0.1, 0.2]
  
# Batch Size
batch_size: [256]

# === MultiSimilarityLoss パラメータ ===
ms_alpha: [1.0, 3.0]   # positive pairsの指数重み (デフォルト: 2.0)
ms_beta: [40.0, 60.0]  # negative pairsの指数重み (デフォルト: 50.0)
ms_base: [0.5]    # 指数のシフト値 (デフォルト: 0.5)

# === 学習環境 ===
epochs: 500
num_workers: 4
pin_memory: true
device: cuda
seed: 50
use_cross_validation: false
cv_splits: 3
use_augmentation: true
