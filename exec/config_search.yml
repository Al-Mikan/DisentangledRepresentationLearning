# config_search.yaml
# === 実験設定 ===
project_name: animalkingdom_aug
experiment_name: triplet_vs_gan
output_root: ./train_result
train_label_paths:
  [./label/train/animalkingdom.csv, ./label/train/animalkingdom_augmented.csv]
test_label_paths: ./label/test/elephant.csv

# === モード設定 ===
train_mode: [gated] # mae / flow / gated
loss_type: [triplet] #cosine / triplet
adversarial: [gan] # True: GAN方式 / False: 通常正則化
flow_preprocessing: [centered] # normal / centered
pooling: True

# === モデル設定 ===
fused_dim: 512
feature_dim: 256

# === ハイパーパラメータ探索 ===
triplet_margin: 0.2
lambda_adv: [0.01, 0.05]
lambda_cls: [0.01, 0.05]
lr_enc: [1e-4]
lr_disc: [1e-4]
batch_size: 256
disc_steps_per_batch: 1
weight_decay: 1e-2

# === 学習環境 ===
epochs: 500
num_workers: 4
pin_memory: true
device: cuda
seed: 50
use_cross_validation: false
cv_splits: 3
use_augmentation: true
