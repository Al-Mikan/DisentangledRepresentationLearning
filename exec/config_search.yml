# config_search.yaml
# === 実験設定 ===
project_name: animalkingdom_split5
experiment_name: triplet_vs_gan
output_root: ./train_result
datatype: animalkingdom_split

# === モード設定 ===
train_mode: [gated] # mae / flow / gated
loss_type: [triplet] # supcon / cosine / triplet
adversarial: [kl] # True: GAN方式 / False: 通常正則化
flow_preprocessing: [normal] # normal / centered
pooling: True

# === モデル設定 ===
fused_dim: 512
feature_dim: 256

# === ハイパーパラメータ探索 ===
triplet_margin: [0.5, 1.5]
temperature: 0.07 # 固定
lambda_adv: [0.1, 0.5]
lambda_cls: [0.0, 0.5]
lr_enc: [1e-5, 5e-4, log]
lr_disc: [1e-5, 5e-4, log]
batch_size: 256
disc_steps_per_batch: 1

# === 学習環境 ===
epochs: 500
num_workers: 4
pin_memory: true
device: cuda
seed: 42
use_cross_validation: true
cv_splits: 3
