# config_search.yaml
# None（null）または配列 → Optuna探索対象
# 値がスカラー → 固定値として使用

# === モード設定 ===
use_adversarial: [true, false]   # True: GAN方式 / False: 通常正則化
train_mode: gated                # mae / flow / gated など
loss_type: triplet               # supcon / cosine / triplet など

# === ハイパーパラメータ探索 ===
triplet_margin: [0.05, 0.3]      # Triplet loss margin探索
temperature: 0.07                # SupCon用（固定）
lambda_adv: [0.01, 0.3]          # 敵対的重み λ
lr_enc: [1e-5, 5e-4, log]        # Encoder学習率（logスケール）
lr_disc: [1e-5, 5e-4, log]       # Discriminator学習率（logスケール）
batch_size: [16, 32, 64]         # バッチサイズ探索
disc_steps_per_batch: 1          # 固定

# === 学習環境 ===
epochs: 50
fused_dim: 512
